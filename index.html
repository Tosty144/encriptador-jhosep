<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encriptador de Jhosep</title>
  <style>
    :root {
      --fondo: #eef2f7;
      --tarjeta: #ffffff;
      --texto: #14213d;
      --suave: #5b6b84;
      --borde: #cbd5e3;
      --acento: #1d4ed8;
      --acento-texto: #ffffff;
      --error: #b42318;
      --error-fondo: #fdecea;
      --ok-fondo: #e8f0fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0e1625;
        --tarjeta: #17223a;
        --texto: #e8eefb;
        --suave: #9fb0cc;
        --borde: #2c3b5a;
        --acento: #6c9bff;
        --acento-texto: #0e1625;
        --error: #ff9b91;
        --error-fondo: #3a1c1c;
        --ok-fondo: #1f2f52;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 640px; }
    h1 { font-size: 1.9rem; margin: 0 0 4px; }
    .sub { margin: 0 0 24px; color: var(--suave); }
    .menu { display: flex; gap: 8px; margin-bottom: 16px; }
    .menu button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid var(--acento);
      background: transparent;
      color: var(--acento);
      border-radius: 8px;
      cursor: pointer;
    }
    .menu button[aria-pressed="true"] { background: var(--acento); color: var(--acento-texto); }
    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 20px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px;
      font: inherit;
      color: var(--texto);
      background: var(--fondo);
      border: 1px solid var(--borde);
      border-radius: 8px;
      resize: vertical;
    }
    .acciones { display: flex; gap: 8px; margin-top: 12px; }
    .acciones button {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    #btnProcesar { background: var(--acento); color: var(--acento-texto); border: 2px solid var(--acento); }
    #btnLimpiar { background: transparent; color: var(--texto); border: 2px solid var(--borde); }
    button:focus-visible, textarea:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
    .error {
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--error-fondo);
      color: var(--error);
      border-radius: 8px;
    }
    .paso { margin-top: 16px; }
    .paso h2 { font-size: 1rem; margin: 0 0 4px; }
    .paso .desc { margin: 0 0 6px; color: var(--suave); font-size: 0.9rem; }
    .caja {
      padding: 10px 12px;
      background: var(--ok-fondo);
      border-radius: 8px;
      font-family: Consolas, "Courier New", monospace;
      word-break: break-all;
      min-height: 42px;
    }
    .copiar {
      margin-top: 6px;
      padding: 6px 12px;
      font-size: 0.9rem;
      background: transparent;
      color: var(--acento);
      border: 1px solid var(--acento);
      border-radius: 6px;
      cursor: pointer;
    }
    .oculto { display: none; }
    footer { margin-top: 20px; color: var(--suave); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Encriptador de Jhosep</h1>
    <p class="sub">Elige una opción, escribe el texto y mira cómo pasa por cada paso.</p>

    <div class="menu" role="group" aria-label="Menú principal">
      <button id="btnModoEnc" type="button" aria-pressed="true">Encriptar</button>
      <button id="btnModoDes" type="button" aria-pressed="false">Desencriptar</button>
    </div>

    <section class="tarjeta">
      <label id="etiquetaEntrada" for="entrada">Texto a encriptar</label>
      <textarea id="entrada" placeholder="Escribe aquí, por ejemplo: Bebe"></textarea>

      <div class="acciones">
        <button id="btnProcesar" type="button">Encriptar</button>
        <button id="btnLimpiar" type="button">Limpiar</button>
      </div>

      <div id="error" class="error oculto" role="alert"></div>

      <div id="resultados" class="oculto">
        <div class="paso">
          <h2 id="titulo1"></h2>
          <p id="desc1" class="desc"></p>
          <div id="salida1" class="caja"></div>
        </div>
        <div class="paso">
          <h2 id="titulo2"></h2>
          <p id="desc2" class="desc"></p>
          <div id="salida2" class="caja"></div>
          <button id="btnCopiar" class="copiar" type="button">Copiar resultado final</button>
        </div>
      </div>
    </section>

    <footer>Encriptador de Jhosep · Tabla de equivalencias fija</footer>
  </main>

  <script>
    // ---------- TABLA FIJA PASO 1: carácter -> número de 2 dígitos ----------
    const PASO1 = {
      // Minúsculas
      "a":"47","b":"83","c":"12","d":"65","e":"29","f":"91","g":"38","h":"74","i":"56",
      "j":"20","k":"87","l":"14","m":"61","n":"93","ñ":"35","o":"78","p":"42","q":"19",
      "r":"96","s":"53","t":"27","u":"85","v":"68","w":"31","x":"99","y":"44","z":"72",
      // Mayúsculas
      "A":"16","B":"58","C":"90","D":"23","E":"81","F":"49","G":"67","H":"15","I":"94",
      "J":"36","K":"75","L":"52","M":"28","N":"86","Ñ":"41","O":"13","P":"69","Q":"97",
      "R":"34","S":"62","T":"18","U":"79","V":"45","W":"92","X":"25","Y":"57","Z":"84",
      // Vocales con tilde y diéresis
      "á":"05","é":"63","í":"30","ó":"09","ú":"77","ü":"22",
      "Á":"48","É":"02","Í":"80","Ó":"55","Ú":"10","Ü":"39",
      // Dígitos del texto
      "0":"07","1":"54","2":"01","3":"70","4":"33","5":"46","6":"04","7":"60","8":"24","9":"08",
      // Caracteres especiales
      " ":"32",".":"71",",":"11",";":"66",":":"98","¿":"43","?":"76","¡":"21","!":"59",
      "@":"88","#":"37","$":"64","%":"17","&":"95","*":"51","-":"26","_":"73","(":"89",
      ")":"40","+":"82"
    };

    // ---------- TABLA FIJA PASO 2: dígito -> letra ----------
    const PASO2 = { "0":"r","1":"h","2":"w","3":"l","4":"z","5":"b","6":"q","7":"d","8":"x","9":"t" };

    // Tablas inversas para desencriptar
    const INV1 = {};
    for (const c in PASO1) INV1[PASO1[c]] = c;
    const INV2 = {};
    for (const d in PASO2) INV2[PASO2[d]] = d;

    // ---------- Funciones ----------
    function encriptar(texto) {
      let numeros = "";
      const invalidos = [];
      for (const c of texto) {
        if (PASO1[c] === undefined) {
          if (!invalidos.includes(c)) invalidos.push(c);
        } else {
          numeros += PASO1[c];
        }
      }
      if (invalidos.length) {
        return { error: "Estos caracteres no están en la tabla: " + invalidos.map(c => "«" + c + "»").join(" ") };
      }
      let letras = "";
      for (const d of numeros) letras += PASO2[d];
      return { paso1: numeros, paso2: letras };
    }

    function desencriptar(texto) {
      const limpio = texto.trim();
      let numeros = "";
      for (const c of limpio) {
        if (INV2[c] === undefined) {
          return { error: "El texto encriptado solo puede tener estas letras: r h w l z b q d x t. Revisa «" + c + "»." };
        }
        numeros += INV2[c];
      }
      if (numeros.length % 2 !== 0) {
        return { error: "El texto encriptado está incompleto: la cantidad de letras debe ser par." };
      }
      let original = "";
      for (let i = 0; i < numeros.length; i += 2) {
        const par = numeros.slice(i, i + 2);
        if (INV1[par] === undefined) {
          return { error: "El código «" + par + "» no existe en la tabla. Revisa que el texto esté completo." };
        }
        original += INV1[par];
      }
      return { paso1: numeros, paso2: original };
    }

    // ---------- Interfaz ----------
    let modo = "enc";
    const $ = id => document.getElementById(id);

    function cambiarModo(nuevo) {
      modo = nuevo;
      $("btnModoEnc").setAttribute("aria-pressed", nuevo === "enc");
      $("btnModoDes").setAttribute("aria-pressed", nuevo === "des");
      $("etiquetaEntrada").textContent = nuevo === "enc" ? "Texto a encriptar" : "Texto encriptado";
      $("entrada").placeholder = nuevo === "enc" ? "Escribe aquí, por ejemplo: Bebe" : "Pega aquí, por ejemplo: bxwtxlwt";
      $("btnProcesar").textContent = nuevo === "enc" ? "Encriptar" : "Desencriptar";
      limpiar();
    }

    function limpiar() {
      $("entrada").value = "";
      $("error").classList.add("oculto");
      $("resultados").classList.add("oculto");
    }

    function procesar() {
      const texto = $("entrada").value;
      $("error").classList.add("oculto");
      $("resultados").classList.add("oculto");

      if (texto.trim() === "") {
        $("error").textContent = "Escribe un texto para continuar.";
        $("error").classList.remove("oculto");
        return;
      }

      const r = modo === "enc" ? encriptar(texto) : desencriptar(texto);
      if (r.error) {
        $("error").textContent = r.error;
        $("error").classList.remove("oculto");
        return;
      }

      if (modo === "enc") {
        $("titulo1").textContent = "Paso 1: caracteres a números";
        $("desc1").textContent = "Cada carácter se cambia por su número de 2 dígitos.";
        $("titulo2").textContent = "Paso 2: números a letras (resultado encriptado)";
        $("desc2").textContent = "Cada dígito se cambia por su letra.";
      } else {
        $("titulo1").textContent = "Paso 1: letras a números";
        $("desc1").textContent = "Cada letra se cambia por su dígito.";
        $("titulo2").textContent = "Paso 2: números a caracteres (texto original)";
        $("desc2").textContent = "Los números se cortan de 2 en 2 y cada pareja vuelve a su carácter.";
      }
      $("salida1").textContent = r.paso1;
      $("salida2").textContent = r.paso2;
      $("resultados").classList.remove("oculto");
    }

    function copiar() {
      const texto = $("salida2").textContent;
      const aviso = () => {
        $("btnCopiar").textContent = "Copiado";
        setTimeout(() => { $("btnCopiar").textContent = "Copiar resultado final"; }, 1500);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(texto).then(aviso).catch(() => {});
      }
    }

    $("btnModoEnc").addEventListener("click", () => cambiarModo("enc"));
    $("btnModoDes").addEventListener("click", () => cambiarModo("des"));
    $("btnProcesar").addEventListener("click", procesar);
    $("btnLimpiar").addEventListener("click", limpiar);
    $("btnCopiar").addEventListener("click", copiar);
  </script>
</body>
</html>
