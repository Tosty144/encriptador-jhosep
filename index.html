<html lang="es">

  <meta name="description" content="Encriptador de Jhosep: encripta y desencripta texto gratis en línea con un sistema de dos pasos. Escribe tu mensaje y obtén el resultado al instante.">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Encriptador de Jhosep">

  <meta property="og:locale" content="es_ES">

  <style>
    :root {
      --fondo: #020a1a;
      --tarjeta: rgba(6, 18, 38, 0.9);
      --texto: #e6f7ff;
      --suave: #8fb4c9;
      --borde: #1d5a78;
      --acento: #35e0e0;
      --acento-texto: #021524;
      --caja: rgba(2, 12, 28, 0.92);
      --error: #ffb4ab;
      --error-fondo: rgba(120, 20, 20, 0.45);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      line-height: 1.5;
    }

    /* Fondo: candado y circuitos (SVG) + lluvia de números (canvas) */
    .fondo { position: fixed; inset: 0; z-index: 0; }
    .fondo svg { width: 100%; height: 100%; display: block; }
    #lluvia {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    .pagina {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px 40px;
    }
    main { width: 100%; max-width: 640px; }
    h1 {
      font-size: 1.9rem;
      margin: 0 0 4px;
      text-shadow: 0 0 14px rgba(53, 224, 224, 0.55);
    }
    .sub { margin: 0 0 20px; color: var(--suave); }

    .menu { display: flex; gap: 8px; margin-bottom: 14px; }
    .menu button {
      flex: 1;
      padding: 11px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid var(--acento);
      background: rgba(2, 12, 28, 0.75);
      color: var(--acento);
      border-radius: 8px;
      cursor: pointer;
    }
    .menu button[aria-pressed="true"] {
      background: var(--acento);
      color: var(--acento-texto);
      box-shadow: 0 0 14px rgba(53, 224, 224, 0.5);
    }

    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 20px;
      backdrop-filter: blur(3px);
      box-shadow: 0 0 28px rgba(53, 224, 224, 0.12);
    }
    label, .rotulo { display: block; font-weight: 600; margin-bottom: 6px; }
    .grupo + .grupo { margin-top: 16px; }

    textarea, .caja {
      width: 100%;
      min-height: 96px;
      padding: 10px 12px;
      font: inherit;
      color: var(--texto);
      background: var(--caja);
      border: 1px solid var(--borde);
      border-radius: 8px;
    }
    textarea { resize: vertical; }
    .caja {
      font-family: Consolas, "Courier New", monospace;
      word-break: break-all;
    }
    .caja.vacia { color: var(--suave); font-family: inherit; }

    .fila { display: flex; gap: 8px; margin-top: 8px; }
    .chico {
      padding: 6px 14px;
      font-size: 0.9rem;
      background: transparent;
      color: var(--acento);
      border: 1px solid var(--acento);
      border-radius: 6px;
      cursor: pointer;
    }
    button:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--acento);
      outline-offset: 2px;
    }

    .error {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--error-fondo);
      color: var(--error);
      border-radius: 8px;
    }
    .oculto { display: none; }
    footer { margin-top: 18px; color: var(--suave); font-size: 0.85rem; text-align: center; }

    /* Anonymous (esquina inferior derecha) */
    .anon {
      position: fixed;
      right: 14px;
      bottom: 0;
      width: 190px;
      z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(53, 224, 224, 0.35));
    }
    .anon svg { display: block; width: 100%; height: auto; overflow: hidden; }
    .mano { transition: transform 0.7s cubic-bezier(0.3, 1.25, 0.5, 1); }
    .pupila { opacity: 0; transition: opacity 0.5s ease 0.3s; }
    .anon[data-estado="libre"] .mano-izq { transform: translate(-22px, 98px); }
    .anon[data-estado="libre"] .mano-der { transform: translate(22px, 98px); }
    .anon[data-estado="libre"] .pupila { opacity: 1; }

    @media (max-width: 700px) {
      .anon { width: 112px; right: 6px; }
      .pagina { padding-bottom: 140px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mano, .pupila { transition: none; }
    }
  </style>
</head>

  <script>
    // ---------- TABLA FIJA PASO 1: carácter -> número de 2 dígitos ----------
    const PASO1 = {
      // Minúsculas
      "a":"47","b":"83","c":"12","d":"65","e":"29","f":"91","g":"38","h":"74","i":"56",
      "j":"20","k":"87","l":"14","m":"61","n":"93","ñ":"35","o":"78","p":"42","q":"19",
      "r":"96","s":"53","t":"27","u":"85","v":"68","w":"31","x":"99","y":"44","z":"72",
      // Mayúsculas
      "A":"16","B":"58","C":"90","D":"23","E":"81","F":"49","G":"67","H":"15","I":"94",
      "J":"36","K":"75","L":"52","M":"28","N":"86","Ñ":"41","O":"13","P":"69","Q":"97",
      "R":"34","S":"62","T":"18","U":"79","V":"45","W":"92","X":"25","Y":"57","Z":"84",
      // Vocales con tilde y diéresis
      "á":"05","é":"63","í":"30","ó":"09","ú":"77","ü":"22",
      "Á":"48","É":"02","Í":"80","Ó":"55","Ú":"10","Ü":"39",
      // Dígitos del texto
      "0":"07","1":"54","2":"01","3":"70","4":"33","5":"46","6":"04","7":"60","8":"24","9":"08",
      // Caracteres especiales
      " ":"32",".":"71",",":"11",";":"66",":":"98","¿":"43","?":"76","¡":"21","!":"59",
      "@":"88","#":"37","$":"64","%":"17","&":"95","*":"51","-":"26","_":"73","(":"89",
      ")":"40","+":"82"
    };

    // ---------- TABLA FIJA PASO 2: dígito -> letra ----------
    const PASO2 = { "0":"r","1":"h","2":"w","3":"l","4":"z","5":"b","6":"q","7":"d","8":"x","9":"t" };

    // Tablas inversas para desencriptar
    const INV1 = {};
    for (const c in PASO1) INV1[PASO1[c]] = c;
    const INV2 = {};
    for (const d in PASO2) INV2[PASO2[d]] = d;

    // ---------- Funciones (devuelven solo el resultado final) ----------
    function encriptar(texto) {
      let numeros = "";
      const invalidos = [];
      for (const c of texto) {
        if (PASO1[c] === undefined) {
          if (!invalidos.includes(c)) invalidos.push(c);
        } else {
          numeros += PASO1[c];
        }
      }
      if (invalidos.length) {
        return { error: "Estos caracteres no están en la tabla: " + invalidos.map(c => "«" + c + "»").join(" ") };
      }
      let letras = "";
      for (const d of numeros) letras += PASO2[d];
      return { resultado: letras };
    }

    function desencriptar(texto) {
      const limpio = texto.trim();
      let numeros = "";
      for (const c of limpio) {
        if (INV2[c] === undefined) {
          return { error: "El texto encriptado solo puede tener estas letras: r h w l z b q d x t. Revisa «" + c + "»." };
        }
        numeros += INV2[c];
      }
      if (numeros.length % 2 !== 0) {
        return { error: "El texto encriptado está incompleto: la cantidad de letras debe ser par." };
      }
      let original = "";
      for (let i = 0; i < numeros.length; i += 2) {
        const par = numeros.slice(i, i + 2);
        if (INV1[par] === undefined) {
          return { error: "El código «" + par + "» no existe en la tabla. Revisa que el texto esté completo." };
        }
        original += INV1[par];
      }
      return { resultado: original };
    }

    // ---------- Interfaz ----------
    let modo = "enc";
    let ultimo = "";
    const $ = id => document.getElementById(id);
    const TEXTO_VACIO = "El resultado aparece aquí";

    function pintarSalida(texto) {
      const caja = $("salida");
      if (texto) {
        caja.textContent = texto;
        caja.classList.remove("vacia");
      } else {
        caja.textContent = TEXTO_VACIO;
        caja.classList.add("vacia");
      }
    }

    function actualizar() {
      const texto = $("entrada").value;
      $("error").classList.add("oculto");
      ultimo = "";

      if (texto.trim() === "") {
        pintarSalida("");
        return;
      }

      const r = modo === "enc" ? encriptar(texto) : desencriptar(texto);
      if (r.error) {
        $("error").textContent = r.error;
        $("error").classList.remove("oculto");
        pintarSalida("");
      } else {
        ultimo = r.resultado;
        pintarSalida(r.resultado);
      }
    }

    function cambiarModo(nuevo) {
      modo = nuevo;
      $("btnModoEnc").setAttribute("aria-pressed", nuevo === "enc");
      $("btnModoDes").setAttribute("aria-pressed", nuevo === "des");
      $("etiquetaEntrada").textContent = nuevo === "enc" ? "Texto a encriptar" : "Texto encriptado";
      $("etiquetaSalida").textContent = nuevo === "enc" ? "Texto encriptado" : "Texto original";
      $("entrada").placeholder = nuevo === "enc" ? "Escribe aquí, por ejemplo: Bebe" : "Pega aquí, por ejemplo: bxwtxlwt";
      // Anonymous: tapado al encriptar, descubierto al desencriptar
      $("anon").dataset.estado = nuevo === "enc" ? "tapado" : "libre";
      $("anonSvg").setAttribute("aria-label", nuevo === "enc" ? "Anonymous tapándose los ojos" : "Anonymous con la cara descubierta");
      limpiar();
    }

    function limpiar() {
      $("entrada").value = "";
      actualizar();
      $("entrada").focus();
    }

    function copiar() {
      if (!ultimo) return;
      const aviso = () => {
        $("btnCopiar").textContent = "Copiado";
        setTimeout(() => { $("btnCopiar").textContent = "Copiar resultado"; }, 1500);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(ultimo).then(aviso).catch(() => {});
      }
    }

    $("btnModoEnc").addEventListener("click", () => cambiarModo("enc"));
    $("btnModoDes").addEventListener("click", () => cambiarModo("des"));
    $("entrada").addEventListener("input", actualizar);
    $("btnLimpiar").addEventListener("click", limpiar);
    $("btnCopiar").addEventListener("click", copiar);
    pintarSalida("");

    // ---------- Lluvia de números tipo hacker ----------
    (function () {
      const canvas = $("lluvia");
      const ctx = canvas.getContext("2d");
      const TAM = 16;          // tamaño de letra
      const ANCHO_COL = 24;    // separación entre columnas
      const sinMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let ancho = 0, alto = 0, gotas = [], ultimoCuadro = 0;

      function nuevaGota(inicial) {
        const largo = 8 + Math.floor(Math.random() * 14);
        return {
          y: inicial ? Math.random() * (alto / TAM) : -Math.random() * 40,
          v: 0.15 + Math.random() * 0.35,
          largo: largo,
          chars: Array.from({ length: largo }, () => (Math.random() < 0.5 ? "0" : "1"))
        };
      }

      function iniciar() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        ancho = window.innerWidth;
        alto = window.innerHeight;
        canvas.width = ancho * dpr;
        canvas.height = alto * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.font = TAM + "px Consolas, 'Courier New', monospace";
        const columnas = Math.ceil(ancho / ANCHO_COL);
        gotas = Array.from({ length: columnas }, () => nuevaGota(true));
        dibujar(false);
      }

      function dibujar(mover) {
        ctx.clearRect(0, 0, ancho, alto);
        for (let i = 0; i < gotas.length; i++) {
          const g = gotas[i];
          if (mover) {
            g.y += g.v;
            if (Math.random() < 0.05) g.chars[Math.floor(Math.random() * g.largo)] = Math.random() < 0.5 ? "0" : "1";
            if ((g.y - g.largo) * TAM > alto) { gotas[i] = nuevaGota(false); continue; }
          }
          for (let k = 0; k < g.largo; k++) {
            const py = (g.y - k) * TAM;
            if (py < 0 || py > alto + TAM) continue;
            ctx.globalAlpha = (1 - k / g.largo) * (k === 0 ? 0.95 : 0.5);
            ctx.fillStyle = k === 0 ? "#c8ffff" : "#35e0e0";
            ctx.fillText(g.chars[k], i * ANCHO_COL, py);
          }
        }
        ctx.globalAlpha = 1;
      }

      function cuadro(t) {
        if (t - ultimoCuadro >= 33) {   // unos 30 cuadros por segundo
          ultimoCuadro = t;
          dibujar(true);
        }
        requestAnimationFrame(cuadro);
      }

      let temporizador;
      window.addEventListener("resize", () => {
        clearTimeout(temporizador);
        temporizador = setTimeout(iniciar, 150);
      });

      iniciar();
      if (!sinMovimiento) requestAnimationFrame(cuadro);
    })();
  </script>
</body>
</html>
