<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encriptador de Jhosep</title>
  <style>
    :root {
      --fondo: #020a1a;
      --tarjeta: rgba(6, 18, 38, 0.88);
      --texto: #e6f7ff;
      --suave: #8fb4c9;
      --borde: #1d5a78;
      --acento: #35e0e0;
      --acento-texto: #021524;
      --caja: rgba(2, 12, 28, 0.9);
      --error: #ffb4ab;
      --error-fondo: rgba(120, 20, 20, 0.45);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      line-height: 1.5;
    }

    /* Fondo con candado, circuitos y binario */
    .fondo { position: fixed; inset: 0; z-index: 0; }
    .fondo svg { width: 100%; height: 100%; display: block; }

    .pagina {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px 40px;
    }
    main { width: 100%; max-width: 640px; }
    h1 {
      font-size: 1.9rem;
      margin: 0 0 4px;
      text-shadow: 0 0 14px rgba(53, 224, 224, 0.55);
    }
    .sub { margin: 0 0 20px; color: var(--suave); }

    .menu { display: flex; gap: 8px; margin-bottom: 14px; }
    .menu button {
      flex: 1;
      padding: 11px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid var(--acento);
      background: rgba(2, 12, 28, 0.7);
      color: var(--acento);
      border-radius: 8px;
      cursor: pointer;
    }
    .menu button[aria-pressed="true"] {
      background: var(--acento);
      color: var(--acento-texto);
      box-shadow: 0 0 14px rgba(53, 224, 224, 0.5);
    }

    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 20px;
      backdrop-filter: blur(3px);
      box-shadow: 0 0 28px rgba(53, 224, 224, 0.12);
    }
    label, .rotulo { display: block; font-weight: 600; margin-bottom: 6px; }
    .grupo + .grupo { margin-top: 16px; }

    textarea, .caja {
      width: 100%;
      min-height: 96px;
      padding: 10px 12px;
      font: inherit;
      color: var(--texto);
      background: var(--caja);
      border: 1px solid var(--borde);
      border-radius: 8px;
    }
    textarea { resize: vertical; }
    .caja {
      font-family: Consolas, "Courier New", monospace;
      word-break: break-all;
    }
    .caja.vacia { color: var(--suave); font-family: inherit; }

    .fila { display: flex; gap: 8px; margin-top: 8px; }
    .chico {
      padding: 6px 14px;
      font-size: 0.9rem;
      background: transparent;
      color: var(--acento);
      border: 1px solid var(--acento);
      border-radius: 6px;
      cursor: pointer;
    }
    .principal {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--acento-texto);
      background: var(--acento);
      border: 2px solid var(--acento);
      border-radius: 8px;
      cursor: pointer;
    }
    button:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--acento);
      outline-offset: 2px;
    }

    .error {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--error-fondo);
      color: var(--error);
      border-radius: 8px;
    }

    .proceso { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--borde); }
    .paso { margin-top: 12px; }
    .paso h2 { font-size: 1rem; margin: 0 0 2px; }
    .paso .desc { margin: 0 0 6px; color: var(--suave); font-size: 0.9rem; }
    .paso .caja { min-height: 44px; }

    .oculto { display: none; }
    footer { margin-top: 18px; color: var(--suave); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <div class="fondo" aria-hidden="true">

        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#020a1a"/>

          <stop offset="1" stop-color="#021022"/>
        </linearGradient>

        <circle cx="380" cy="60" r="4"/><circle cx="200" cy="290" r="4"/>
        <circle cx="190" cy="510" r="4"/><circle cx="150" cy="600" r="4"/>

        <circle cx="460" cy="560" r="4"/><circle cx="380" cy="20" r="4"/>
      </g>

      <!-- Circuitos y flechas derecha -->
      <g fill="none" stroke="#2aa7c9" stroke-width="1.6" opacity="0.4">
        <path d="M760 700 H900 L940 660 H1100 L1140 700 H1200"/>
        <path d="M800 620 H880 L920 580 H1040"/>

        <path d="M900 60 H1010 L1050 100 H1200"/>

      </g>

        <circle cx="1040" cy="580" r="4"/><circle cx="1100" cy="660" r="4"/>
        <circle cx="880" cy="620" r="4"/><circle cx="960" cy="120" r="4"/>
        <circle cx="1050" cy="100" r="4"/><circle cx="860" cy="760" r="4"/>
      </g>
      <g fill="none" stroke="#35e0e0" stroke-width="5" opacity="0.28" stroke-linejoin="round">
        <path d="M900 250 L940 290 L900 330"/><path d="M940 250 L980 290 L940 330"/>
        <path d="M980 250 L1020 290 L980 330"/><path d="M1020 250 L1060 290 L1020 330"/>
        <path d="M1060 250 L1100 290 L1060 330"/>
        <path d="M860 380 L900 420 L860 460"/><path d="M900 380 L940 420 L900 460"/>
        <path d="M940 380 L980 420 L940 460"/><path d="M980 380 L1020 420 L980 460"/>
      </g>
      <g fill="#ff9a3c" opacity="0.8">
        <circle cx="1080" cy="470" r="5"/><circle cx="1130" cy="500" r="4"/>
        <circle cx="1020" cy="520" r="3"/>
      </g>

      <!-- Binario suelto -->
      <g fill="#5fe0f0" opacity="0.22" font-family="Consolas, 'Courier New', monospace" font-size="15">
        <text x="640" y="90">1001 0110 1010</text>
        <text x="700" y="190">0101 1100</text>
        <text x="620" y="240">110010 011</text>
        <text x="860" y="520">1010 0011 1101</text>
        <text x="1000" y="640">0110 1001</text>
        <text x="760" y="340">101 1100 0101</text>
        <text x="1060" y="200">0011 1010</text>
        <text x="640" y="450">1100 0110</text>
      </g>

      <!-- Candado -->
      <g filter="url(#brillo)">
        <path d="M168 370 V290 A82 82 0 0 1 332 290 V370" fill="none" stroke="#35e0e0" stroke-width="12" stroke-linecap="round"/>
        <path d="M200 370 V292 A50 50 0 0 1 300 292 V370" fill="none" stroke="#35e0e0" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
        <rect x="110" y="368" width="280" height="240" rx="38" fill="rgba(8,70,100,0.45)" stroke="#35e0e0" stroke-width="7"/>
      </g>
      <g fill="#5fe0f0" opacity="0.5" font-family="Consolas, 'Courier New', monospace" font-size="16">
        <text x="135" y="405">0110 1001 1010</text>
        <text x="135" y="432">1101 0010 0110</text>
        <text x="135" y="459">1001 1100</text>
        <text x="300" y="459">0101</text>
        <text x="135" y="486">0011 1010</text>
        <text x="300" y="486">1100</text>
        <text x="135" y="560">1010 0110 0011</text>
        <text x="135" y="587">0101 1001 1100</text>

      <circle cx="250" cy="480" r="27" fill="#020a1a"/>
      <path d="M237 494 L263 494 L272 556 L228 556 Z" fill="#020a1a"/>
    </svg>
  </div>

  <div class="pagina">
    <main>
      <h1>Encriptador de Jhosep</h1>
      <p class="sub">Escribe tu texto y el resultado aparece al instante.</p>

      <div class="menu" role="group" aria-label="Menú principal">
        <button id="btnModoEnc" type="button" aria-pressed="true">Encriptar</button>
        <button id="btnModoDes" type="button" aria-pressed="false">Desencriptar</button>
      </div>

      <section class="tarjeta">
        <div class="grupo">
          <label id="etiquetaEntrada" for="entrada">Texto a encriptar</label>
          <textarea id="entrada" placeholder="Escribe aquí, por ejemplo: Bebe"></textarea>
        </div>

        <div class="grupo">
          <span id="etiquetaSalida" class="rotulo">Texto encriptado</span>
          <div id="salida" class="caja vacia" aria-live="polite" aria-labelledby="etiquetaSalida"></div>
          <div class="fila">
            <button id="btnCopiar" class="chico" type="button">Copiar resultado</button>
            <button id="btnLimpiar" class="chico" type="button">Limpiar</button>
          </div>
        </div>

        <div id="error" class="error oculto" role="alert"></div>

        <button id="btnProceso" class="principal" type="button" aria-expanded="false">Mostrar proceso</button>

        <div id="proceso" class="proceso oculto">
          <div class="paso">
            <h2 id="titulo1"></h2>
            <p id="desc1" class="desc"></p>
            <div id="salida1" class="caja"></div>
          </div>
          <div class="paso">
            <h2 id="titulo2"></h2>
            <p id="desc2" class="desc"></p>
            <div id="salida2" class="caja"></div>
          </div>
        </div>
      </section>

      <footer>Encriptador de Jhosep · Tabla de equivalencias fija</footer>
    </main>
  </div>

  <script>
    // ---------- TABLA FIJA PASO 1: carácter -> número de 2 dígitos ----------
    const PASO1 = {
      // Minúsculas
      "a":"47","b":"83","c":"12","d":"65","e":"29","f":"91","g":"38","h":"74","i":"56",
      "j":"20","k":"87","l":"14","m":"61","n":"93","ñ":"35","o":"78","p":"42","q":"19",
      "r":"96","s":"53","t":"27","u":"85","v":"68","w":"31","x":"99","y":"44","z":"72",
      // Mayúsculas
      "A":"16","B":"58","C":"90","D":"23","E":"81","F":"49","G":"67","H":"15","I":"94",
      "J":"36","K":"75","L":"52","M":"28","N":"86","Ñ":"41","O":"13","P":"69","Q":"97",
      "R":"34","S":"62","T":"18","U":"79","V":"45","W":"92","X":"25","Y":"57","Z":"84",
      // Vocales con tilde y diéresis
      "á":"05","é":"63","í":"30","ó":"09","ú":"77","ü":"22",
      "Á":"48","É":"02","Í":"80","Ó":"55","Ú":"10","Ü":"39",
      // Dígitos del texto
      "0":"07","1":"54","2":"01","3":"70","4":"33","5":"46","6":"04","7":"60","8":"24","9":"08",
      // Caracteres especiales
      " ":"32",".":"71",",":"11",";":"66",":":"98","¿":"43","?":"76","¡":"21","!":"59",
      "@":"88","#":"37","$":"64","%":"17","&":"95","*":"51","-":"26","_":"73","(":"89",
      ")":"40","+":"82"
    };

    // ---------- TABLA FIJA PASO 2: dígito -> letra ----------
    const PASO2 = { "0":"r","1":"h","2":"w","3":"l","4":"z","5":"b","6":"q","7":"d","8":"x","9":"t" };

    // Tablas inversas para desencriptar
    const INV1 = {};
    for (const c in PASO1) INV1[PASO1[c]] = c;
    const INV2 = {};
    for (const d in PASO2) INV2[PASO2[d]] = d;

    // ---------- Funciones ----------
    function encriptar(texto) {
      let numeros = "";
      const invalidos = [];
      for (const c of texto) {
        if (PASO1[c] === undefined) {
          if (!invalidos.includes(c)) invalidos.push(c);
        } else {
          numeros += PASO1[c];
        }
      }
      if (invalidos.length) {
        return { error: "Estos caracteres no están en la tabla: " + invalidos.map(c => "«" + c + "»").join(" ") };
      }
      let letras = "";
      for (const d of numeros) letras += PASO2[d];
      return { paso1: numeros, paso2: letras };
    }

    function desencriptar(texto) {
      const limpio = texto.trim();
      let numeros = "";
      for (const c of limpio) {
        if (INV2[c] === undefined) {
          return { error: "El texto encriptado solo puede tener estas letras: r h w l z b q d x t. Revisa «" + c + "»." };
        }
        numeros += INV2[c];
      }
      if (numeros.length % 2 !== 0) {
        return { error: "El texto encriptado está incompleto: la cantidad de letras debe ser par." };
      }
      let original = "";
      for (let i = 0; i < numeros.length; i += 2) {
        const par = numeros.slice(i, i + 2);
        if (INV1[par] === undefined) {
          return { error: "El código «" + par + "» no existe en la tabla. Revisa que el texto esté completo." };
        }
        original += INV1[par];
      }
      return { paso1: numeros, paso2: original };
    }

    // ---------- Interfaz ----------
    let modo = "enc";
    let ultimo = null;          // último resultado válido
    let procesoVisible = false;
    const $ = id => document.getElementById(id);
    const TEXTO_VACIO = "El resultado aparece aquí";

    function pintarSalida(texto) {
      const caja = $("salida");
      if (texto) {
        caja.textContent = texto;
        caja.classList.remove("vacia");
      } else {
        caja.textContent = TEXTO_VACIO;
        caja.classList.add("vacia");
      }
    }

    function pintarProceso() {
      const panel = $("proceso");
      if (!procesoVisible || !ultimo) {
        panel.classList.add("oculto");
        return;
      }
      if (modo === "enc") {
        $("titulo1").textContent = "Paso 1: caracteres a números";
        $("desc1").textContent = "Cada carácter se cambia por su número de 2 dígitos.";
        $("titulo2").textContent = "Paso 2: números a letras (resultado encriptado)";
        $("desc2").textContent = "Cada dígito se cambia por su letra.";
      } else {
        $("titulo1").textContent = "Paso 1: letras a números";
        $("desc1").textContent = "Cada letra se cambia por su dígito.";
        $("titulo2").textContent = "Paso 2: números a caracteres (texto original)";
        $("desc2").textContent = "Los números se cortan de 2 en 2 y cada pareja vuelve a su carácter.";
      }
      $("salida1").textContent = ultimo.paso1;
      $("salida2").textContent = ultimo.paso2;
      panel.classList.remove("oculto");
    }

    function actualizar() {
      const texto = $("entrada").value;
      $("error").classList.add("oculto");
      ultimo = null;

      if (texto.trim() === "") {
        pintarSalida("");
        pintarProceso();
        return;
      }

      const r = modo === "enc" ? encriptar(texto) : desencriptar(texto);
      if (r.error) {
        $("error").textContent = r.error;
        $("error").classList.remove("oculto");
        pintarSalida("");
      } else {
        ultimo = r;
        pintarSalida(r.paso2);
      }
      pintarProceso();
    }

    function cambiarModo(nuevo) {
      modo = nuevo;
      $("btnModoEnc").setAttribute("aria-pressed", nuevo === "enc");
      $("btnModoDes").setAttribute("aria-pressed", nuevo === "des");
      $("etiquetaEntrada").textContent = nuevo === "enc" ? "Texto a encriptar" : "Texto encriptado";
      $("etiquetaSalida").textContent = nuevo === "enc" ? "Texto encriptado" : "Texto original";
      $("entrada").placeholder = nuevo === "enc" ? "Escribe aquí, por ejemplo: Bebe" : "Pega aquí, por ejemplo: bxwtxlwt";
      $("btnCopiar").textContent = "Copiar resultado";
      limpiar();
    }

    function limpiar() {
      $("entrada").value = "";
      actualizar();
      $("entrada").focus();
    }

    function alternarProceso() {
      procesoVisible = !procesoVisible;
      $("btnProceso").textContent = procesoVisible ? "Ocultar proceso" : "Mostrar proceso";
      $("btnProceso").setAttribute("aria-expanded", procesoVisible);
      pintarProceso();
    }

    function copiar() {
      if (!ultimo) return;
      const aviso = () => {
        $("btnCopiar").textContent = "Copiado";
        setTimeout(() => { $("btnCopiar").textContent = "Copiar resultado"; }, 1500);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(ultimo.paso2).then(aviso).catch(() => {});
      }
    }

    $("btnModoEnc").addEventListener("click", () => cambiarModo("enc"));
    $("btnModoDes").addEventListener("click", () => cambiarModo("des"));
    $("entrada").addEventListener("input", actualizar);
    $("btnLimpiar").addEventListener("click", limpiar);
    $("btnProceso").addEventListener("click", alternarProceso);
    $("btnCopiar").addEventListener("click", copiar);
    pintarSalida("");
  </script>
</body>
</html>
